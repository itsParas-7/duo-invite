<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bun, will you be my duo tonight?</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
    font-family:system-ui,sans-serif;
    background:linear-gradient(
        135deg,
        #f3d6ff 0%,
        #d8d8ff 50%,
        #bfe8ff 100%
    );
}

.card{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(15px);
    border-radius:40px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 20px 60px rgba(170,120,255,.25);
    position:relative;
    z-index:2;
}

.pixel{
    font-size:32px;
    color:#c285ff;
    margin-bottom:20px;
}

h1{
    color:#874fd4;
    font-size:clamp(2rem,8vw,4rem);
    line-height:1.1;
    margin-bottom:25px;
}

p{
    color:#6d6a92;
    font-size:1.25rem;
    line-height:1.7;
    margin-bottom:40px;
}

.buttons{
    position:relative;
    height:220px;
}

button{
    border:none;
    border-radius:999px;
    cursor:pointer;
    font-size:1.4rem;
    font-weight:700;
    padding:18px 42px;
    position:relative;
    overflow:hidden;
    transition:.25s;
}

#yes{
    background:linear-gradient(
        90deg,
        #d384ff,
        #b67dff
    );
    color:white;
    box-shadow:0 0 35px rgba(211,132,255,.5);

    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-130%, -50%);
}

#yes:hover{
    transform:translate(-130%, -50%) scale(1.06);
}

#no{
    background:#bde4ff;
    color:#2b2b5c;

    position:absolute;
    left:60%;
    top:50%;
    transform:translateY(-50%);
}

.footer{
    margin-top:20px;
    color:#666;
    font-size:1.1rem;
}

.float{
    position:fixed;
    pointer-events:none;
    opacity:.35;
    z-index:1;
    animation:float 12s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh);
    }
    to{
        transform:translateY(-120vh);
    }
}

.ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    transform:scale(0);
    animation:ripple .6s linear;
    pointer-events:none;
}

@keyframes ripple{
    to{
        transform:scale(4);
        opacity:0;
    }
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    z-index:9999;
    pointer-events:none;
}

</style>
</head>

<body>

<div class="card" id="card">

<div class="pixel">
🎮 ♡ 🎮
</div>

<h1>
Bun, Will you be my duo tonight?
</h1>

<p>
Say Yes, I know you still need 60 levels for that Funny Bunny title.
<br><br>
Or try clicking "No" and see what happens...
</p>

<div class="buttons">

<button id="yes">
Yes 💜
</button>

<button id="no">
No
</button>

</div>

<div class="footer">
made with pixels & love ✨
</div>

</div>

<script>

const noBtn = document.getElementById("no");

const positions = [
    {left:"65%", top:"50%"},
    {left:"10%", top:"20%"},
    {left:"70%", top:"15%"},
    {left:"15%", top:"70%"},
    {left:"65%", top:"75%"},
    {left:"40%", top:"15%"},
    {left:"45%", top:"80%"}
];

function moveButton(){

    const pos =
        positions[
            Math.floor(
                Math.random()*positions.length
            )
        ];

    noBtn.style.left = pos.left;
    noBtn.style.top = pos.top;
}

noBtn.addEventListener("mouseenter", moveButton);

noBtn.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    moveButton();
});

function ripple(button,e){

    const circle =
        document.createElement("span");

    circle.classList.add("ripple");

    const rect =
        button.getBoundingClientRect();

    const size = 60;

    circle.style.width=size+"px";
    circle.style.height=size+"px";

    circle.style.left=
        (e.clientX-rect.left-size/2)+"px";

    circle.style.top=
        (e.clientY-rect.top-size/2)+"px";

    button.appendChild(circle);

    setTimeout(()=>{
        circle.remove();
    },600);
}

document.querySelectorAll("button")
.forEach(btn=>{

    btn.addEventListener("click",(e)=>{
        ripple(btn,e);
    });

});

function confettiBurst(){

    for(let i=0;i<180;i++){

        const piece =
            document.createElement("div");

        piece.className="confetti";

        piece.style.left=
            Math.random()*100+"vw";

        piece.style.top="-20px";

        piece.style.background=
            `hsl(${Math.random()*360},
            100%,70%)`;

        document.body.appendChild(piece);

        piece.animate(
            [
                {
                    transform:
                    "translateY(0) rotate(0deg)"
                },
                {
                    transform:
                    `translateY(
                    ${window.innerHeight+200}px)
                    rotate(
                    ${Math.random()*1080}deg)`
                }
            ],
            {
                duration:
                    2500+
                    Math.random()*2000
            }
        );

        setTimeout(()=>{
            piece.remove();
        },5000);
    }
}

document.getElementById("yes")
.addEventListener("click",()=>{

    confettiBurst();

    setTimeout(()=>{

        document.getElementById("card")
        .innerHTML=`

        <div class="pixel">
        🎮 ♡ 🎮
        </div>

        <h1>
        Let's win together 💜
        </h1>

        <p>
        I knew you'd say yes 😊
        <br><br>
        Let's queue up later tonight.
        </p>

        <button id="party"
        style="
        background:linear-gradient(
        90deg,
        #d384ff,
        #b67dff);
        color:white;
        padding:18px 42px;
        border:none;
        border-radius:999px;
        font-size:1.2rem;
        font-weight:700;">
        More Confetti 🎉
        </button>

        <div class="footer">
        made with pixels & love ✨
        </div>
        `;

        document
        .getElementById("party")
        .addEventListener(
            "click",
            confettiBurst
        );

    },700);

});

const icons=[
"💜",
"✨",
"♡",
"🎮"
];

for(let i=0;i<35;i++){

    const el =
        document.createElement("div");

    el.className="float";

    el.innerHTML=
        icons[
            Math.floor(
                Math.random()*icons.length
            )
        ];

    el.style.left=
        Math.random()*100+"vw";

    el.style.fontSize=
        (18+Math.random()*25)+"px";

    el.style.animationDuration=
        (8+Math.random()*10)+"s";

    document.body.appendChild(el);
}

</script>

</body>
</html>
