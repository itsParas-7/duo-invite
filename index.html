<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bun, Will you be my duo tonight?</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#efd0ff,#b8e4ff);
  font-family:system-ui,sans-serif;
  overflow:hidden;
  padding:20px;
}

.card{
  width:100%;
  max-width:700px;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(12px);
  border-radius:40px;
  padding:40px 25px;
  text-align:center;
  box-shadow:0 20px 50px rgba(173,120,255,.25);
}

.pixel{
  color:#c98bff;
  font-size:28px;
  margin-bottom:20px;
}

h1{
  color:#7c4cc9;
  font-size:clamp(2rem,6vw,4rem);
  line-height:1.15;
  margin-bottom:20px;
}

p{
  color:#6d6991;
  font-size:1.2rem;
  line-height:1.6;
  margin-bottom:40px;
}

.buttons{
  position:relative;
  height:90px;
}

button{
  border:none;
  cursor:pointer;
  border-radius:999px;
  padding:18px 40px;
  font-size:1.4rem;
  font-weight:700;
  transition:.25s;
}

#yes{
  background:linear-gradient(90deg,#c87cff,#b47cff);
  color:white;
  box-shadow:0 0 30px rgba(200,124,255,.5);
}

#yes:hover{
  transform:scale(1.05);
}

#no{
  background:#bfe5ff;
  color:#2d2d5f;
  position:absolute;
  margin-left:20px;
}

.footer{
  margin-top:30px;
  color:#666;
  font-size:1.1rem;
}

.float{
  position:absolute;
  opacity:.35;
  animation:float 14s linear infinite;
  font-size:30px;
}

@keyframes float{
  from{
    transform:translateY(100vh) rotate(0deg);
  }
  to{
    transform:translateY(-120vh) rotate(360deg);
  }
}
</style>
</head>
<body>

<div class="card" id="card">

<div class="pixel">🎮 ♡ 🎮</div>

<h1>Bun, Will you be my duo tonight?</h1>

<p>
Say Yes, I know you still need 60 levels for that Funny Bunny title.
Or try clicking "No" and see what happens...
</p>

<div class="buttons">
  <button id="yes">Yes 💜</button>
  <button id="no">No</button>
</div>

<div class="footer">
made with pixels & love
</div>

</div>

<script>

const noBtn = document.getElementById("no");

function moveButton(){
  const x = Math.random()*220 - 110;
  const y = Math.random()*70 - 35;

  noBtn.style.transform =
    `translate(${x}px,${y}px)`;
}

noBtn.addEventListener("mouseenter", moveButton);
noBtn.addEventListener("click", moveButton);
noBtn.addEventListener("touchstart", moveButton);

document.getElementById("yes").onclick = () => {

document.getElementById("card").innerHTML = `
<div class="pixel">🎮 ♡ 🎮</div>

<h1>Let's win together 💜</h1>

<p>
I knew you'd say yes 😊 let's queue up later tonight
</p>

<button id="party"
style="
background:linear-gradient(90deg,#c87cff,#b47cff);
color:white;
border:none;
padding:18px 40px;
border-radius:999px;
font-size:1.2rem;
font-weight:700;
">
More confetti 🎉
</button>

<div class="footer">
made with pixels & love
</div>
`;

spawnHearts(60);
};

function spawnHearts(amount){

for(let i=0;i<amount;i++){

const el=document.createElement("div");

el.className="float";

el.innerHTML=Math.random()>0.5?"💜":"✨";

el.style.left=Math.random()*100+"vw";

el.style.animationDuration=
(8+Math.random()*10)+"s";

document.body.appendChild(el);

setTimeout(()=>{
el.remove();
},18000);
}
}

spawnHearts(25);

</script>

</body>
</html>
