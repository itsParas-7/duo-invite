<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bun, Will you be my duo tonight?</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#f1d5ff,#bde7ff);
    font-family:system-ui,sans-serif;
    overflow:hidden;
    padding:20px;
}

.card{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(14px);
    border-radius:40px;
    padding:40px 25px;
    text-align:center;
    box-shadow:0 20px 60px rgba(171,120,255,.25);
    position:relative;
}

.pixel{
    color:#c184ff;
    font-size:32px;
    margin-bottom:20px;
}

h1{
    color:#8b4fd9;
    font-size:clamp(2rem,7vw,4rem);
    line-height:1.15;
    margin-bottom:20px;
}

p{
    color:#6f6f8f;
    font-size:1.25rem;
    line-height:1.7;
    margin-bottom:40px;
}

.buttons{
    position:relative;
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:30px;
}

button{
    border:none;
    border-radius:999px;
    cursor:pointer;
    padding:18px 42px;
    font-size:1.5rem;
    font-weight:700;
    overflow:hidden;
    position:relative;
    transition:.25s;
}

#yes{
    background:linear-gradient(90deg,#d17fff,#b57fff);
    color:white;
    box-shadow:0 0 40px rgba(209,127,255,.5);
}

#yes:hover{
    transform:scale(1.07);
}

#yes:active{
    transform:scale(.95);
}

#no{
    background:#bde5ff;
    color:#2b2b5c;
}

.footer{
    color:#666;
    font-size:1.15rem;
    margin-top:20px;
}

.float{
    position:fixed;
    pointer-events:none;
    opacity:.35;
    animation:float 12s linear infinite;
    z-index:0;
}

@keyframes float{
    from{
        transform:translateY(110vh) rotate(0deg);
    }
    to{
        transform:translateY(-120vh) rotate(360deg);
    }
}

.ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    transform:scale(0);
    animation:ripple .6s linear;
    pointer-events:none;
}

@keyframes ripple{
    to{
        transform:scale(4);
        opacity:0;
    }
}

</style>
</head>
<body>

<div class="card" id="card">

<div class="pixel">
🎮 ♡ 🎮
</div>

<h1>
Bun, Will you be my duo tonight?
</h1>

<p>
Say Yes, I know you still need 60 levels for that Funny Bunny title.
<br><br>
Or try clicking "No" and see what happens...
</p>

<div class="buttons">

<button id="yes">
Yes 💜
</button>

<button id="no">
No
</button>

</div>

<div class="footer">
made with pixels & love ✨
</div>

</div>

<script>

const noBtn = document.getElementById("no");

function moveButton(){

    const card = document.querySelector('.card');
    const rect = card.getBoundingClientRect();

    const maxX = rect.width - noBtn.offsetWidth - 60;
    const maxY = rect.height - noBtn.offsetHeight - 100;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseenter", moveButton);

noBtn.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    moveButton();
});

function addRipple(button,e){

    const ripple=document.createElement("span");

    ripple.classList.add("ripple");

    const rect=button.getBoundingClientRect();

    ripple.style.width="60px";
    ripple.style.height="60px";

    ripple.style.left=
    (e.clientX-rect.left-30)+"px";

    ripple.style.top=
    (e.clientY-rect.top-30)+"px";

    button.appendChild(ripple);

    setTimeout(()=>{
        ripple.remove();
    },600);
}

document.querySelectorAll("button").forEach(btn=>{

    btn.addEventListener("click",(e)=>{
        addRipple(btn,e);
    });

});

function confettiBurst(){

    for(let i=0;i<150;i++){

        const piece=document.createElement("div");

        piece.style.position="fixed";

        piece.style.left=Math.random()*100+"vw";

        piece.style.top="-20px";

        piece.style.width="10px";

        piece.style.height="10px";

        piece.style.background=
        `hsl(${Math.random()*360},100%,70%)`;

        piece.style.borderRadius="2px";

        piece.style.zIndex="9999";

        piece.style.pointerEvents="none";

        document.body.appendChild(piece);

        piece.animate(
        [
            {
                transform:"translateY(0) rotate(0deg)"
            },
            {
                transform:
                `translateY(${window.innerHeight+200}px)
                rotate(${Math.random()*1080}deg)`
            }
        ],
        {
            duration:2500+Math.random()*1500
        });

        setTimeout(()=>{
            piece.remove();
        },4500);
    }
}

document.getElementById("yes").addEventListener("click",()=>{

    confettiBurst();

    setTimeout(()=>{

        document.getElementById("card").innerHTML=`

        <div class="pixel">
        🎮 ♡ 🎮
        </div>

        <h1>
        Let's win together 💜
        </h1>

        <p>
        I knew you'd say yes 😊<br><br>
        Let's queue up later tonight.
        </p>

        <button id="celebrate">
        More Confetti 🎉
        </button>

        <div class="footer">
        made with pixels & love ✨
        </div>
        `;

        document.getElementById("celebrate")
        .addEventListener("click",confettiBurst);

    },800);

});

function floatingStuff(){

    const icons=[
        "💜",
        "✨",
        "🎮",
        "♡"
    ];

    for(let i=0;i<30;i++){

        const el=document.createElement("div");

        el.className="float";

        el.innerHTML=
        icons[Math.floor(Math.random()*icons.length)];

        el.style.left=
        Math.random()*100+"vw";

        el.style.fontSize=
        (20+Math.random()*25)+"px";

        el.style.animationDuration=
        (8+Math.random()*10)+"s";

        document.body.appendChild(el);
    }
}

floatingStuff();

</script>

</body>
</html>
