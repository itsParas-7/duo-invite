<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Duo Invite 💜</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:
linear-gradient(
135deg,
#f2d5ff 0%,
#ddd6ff 50%,
#c3e7ff 100%
);
padding:20px;
}

.card{
width:100%;
max-width:680px;
background:rgba(255,255,255,.45);
backdrop-filter:blur(16px);
border-radius:40px;
padding:40px 25px;
text-align:center;
box-shadow:
0 20px 60px rgba(170,120,255,.20);
position:relative;
z-index:5;
}

.top-icons{
font-size:36px;
margin-bottom:25px;
color:#c17fff;
}

h1{
color:#8a4dd6;
font-size:clamp(2.2rem,8vw,4rem);
line-height:1.1;
margin-bottom:25px;
font-weight:800;
}

.subtitle{
font-size:1.3rem;
line-height:1.8;
color:#6d6a92;
margin-bottom:40px;
}

.buttons{
position:relative;
height:180px;
display:flex;
justify-content:center;
align-items:center;
}

button{
border:none;
border-radius:999px;
padding:18px 40px;
font-size:1.4rem;
font-weight:700;
cursor:pointer;
position:relative;
overflow:hidden;
transition:.25s;
}

#yes{
background:
linear-gradient(
90deg,
#d785ff,
#b67eff
);
color:white;
box-shadow:
0 0 35px rgba(215,133,255,.55);
position:absolute;
left:20%;
}

#yes:active{
transform:scale(.95);
}

#no{
background:#bde5ff;
color:#2b2b5c;
position:absolute;
right:20%;
}

.footer{
margin-top:20px;
font-size:1.15rem;
color:#666;
}

.float{
position:fixed;
pointer-events:none;
opacity:.35;
animation:float linear infinite;
z-index:1;
}

@keyframes float{

from{
transform:
translateY(110vh)
rotate(0deg);
}

to{
transform:
translateY(-120vh)
rotate(360deg);
}

}

.ripple{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.8);
transform:scale(0);
animation:ripple .6s linear;
pointer-events:none;
}

@keyframes ripple{

to{
transform:scale(4);
opacity:0;
}

}

.confetti{
position:fixed;
width:10px;
height:10px;
pointer-events:none;
z-index:9999;
}

</style>
</head>

<body>

<div class="card" id="card">

<div class="top-icons">
🎮 ♡ 🎮
</div>

<h1>
Bun,<br>
will you be my<br>
duo tonight?
</h1>

<div class="subtitle">
Say Yes, I know you still need 60 levels for that Funny Bunny title.
<br><br>
Or try clicking "No" and see what happens...
</div>

<div class="buttons">

<button id="yes">
Yes 💜
</button>

<button id="no">
No
</button>

</div>

<div class="footer">
made with pixels & love ✨
</div>

</div>

<script>

const noBtn=document.getElementById("no");

const texts=[
"No",
"Are you sure?",
"Really?",
"Think again 💜",
"Wrong answer 😤"
];

let count=0;

const positions=[
{left:"65%",top:"50%"},
{left:"10%",top:"15%"},
{left:"65%",top:"15%"},
{left:"10%",top:"75%"},
{left:"65%",top:"75%"},
{left:"40%",top:"10%"},
{left:"40%",top:"80%"}
];

function moveNo(){

const pos=
positions[
Math.floor(
Math.random()*positions.length
)
];

noBtn.style.left=pos.left;
noBtn.style.top=pos.top;
noBtn.style.right="auto";

count++;

noBtn.innerText=
texts[
Math.min(
count,
texts.length-1
)
];

}

noBtn.addEventListener(
"mouseenter",
moveNo
);

noBtn.addEventListener(
"touchstart",
e=>{
e.preventDefault();
moveNo();
}
);

function ripple(btn,e){

const circle=
document.createElement("span");

circle.classList.add("ripple");

const rect=
btn.getBoundingClientRect();

circle.style.width="60px";
circle.style.height="60px";

circle.style.left=
(e.clientX-rect.left-30)+"px";

circle.style.top=
(e.clientY-rect.top-30)+"px";

btn.appendChild(circle);

setTimeout(()=>{
circle.remove();
},600);

}

document.querySelectorAll("button")
.forEach(btn=>{

btn.addEventListener(
"click",
e=>ripple(btn,e)
);

});

function confetti(){

for(let i=0;i<180;i++){

const c=
document.createElement("div");

c.className="confetti";

c.style.left=
(window.innerWidth/2)+"px";

c.style.top=
(window.innerHeight/2)+"px";

c.style.background=
`hsl(${Math.random()*360},
100%,70%)`;

document.body.appendChild(c);

const x=
(Math.random()-0.5)*1200;

const y=
(Math.random()-0.5)*1200;

c.animate(

[
{
transform:
"translate(0,0)"
},
{
transform:
`translate(${x}px,${y}px)
rotate(${Math.random()*1080}deg)`
}
],

{
duration:
2000+
Math.random()*1500
}

);

setTimeout(()=>{
c.remove();
},3500);

}

}

document
.getElementById("yes")
.addEventListener("click",()=>{

confetti();

setTimeout(()=>{

document
.getElementById("card")
.innerHTML=`

<div class="top-icons">
🎮 ♡ 🎮
</div>

<h1>
Let's win together 💜
</h1>

<div class="subtitle">

I knew you'd say yes 😊

<br><br>

Let's queue up later tonight.

</div>

<button id="party"
style="
background:
linear-gradient(
90deg,
#d785ff,
#b67eff
);
color:white;
font-size:1.2rem;
font-weight:700;
padding:18px 40px;
border:none;
border-radius:999px;
">

More Confetti 🎉

</button>

<div class="footer">
made with pixels & love ✨
</div>

`;

document
.getElementById("party")
.addEventListener(
"click",
confetti
);

},700);

});

const icons=[
"💜",
"♡",
"🎮",
"✨"
];

for(let i=0;i<40;i++){

const item=
document.createElement("div");

item.className="float";

item.innerHTML=
icons[
Math.floor(
Math.random()*icons.length
)
];

item.style.left=
Math.random()*100+"vw";

item.style.fontSize=
(18+Math.random()*20)+"px";

item.style.animationDuration=
(8+Math.random()*12)+"s";

document.body.appendChild(item);

}

</script>

</body>
</html>
